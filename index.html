<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RVU Tracker">
  <title>RVU Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>RVU Tracker</h1>
    <div class="chip" id="hdr-week" aria-live="polite"></div>
  </header>

  <main id="view" tabindex="-1">
    <p class="loading">Loading CMS data…</p>
  </main>

  <footer class="foot" id="foot"></footer>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="tally">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Tally</span>
    </button>
    <button data-tab="codes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Codes</span>
    </button>
    <button data-tab="pace">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/></svg><span>Pace</span>
    </button>
    <button data-tab="planner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6v16H5zM13 4h6v16h-6z"/></svg><span>Planner</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
